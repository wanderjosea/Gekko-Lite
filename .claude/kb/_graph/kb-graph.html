const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
let W, H, DPR;
function resize(){ DPR=devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

// legend
const leg = document.getElementById('legend');
for (const [k,v] of Object.entries(G.colors)) if(k!=='unknown')
  leg.insertAdjacentHTML('beforeend',
    `<span><i class="dot" style="background:${v}"></i>${k}</span>`);

// build node/edge objects
const nodes = G.nodes.map(n => ({...n,
  x: W/2 + (Math.random()-.5)*300, y: H/2 + (Math.random()-.5)*300,
  vx:0, vy:0, r: 4 + Math.sqrt(n.degree||0)*3 }));
const idx = Object.fromEntries(nodes.map((n,i)=>[n.slug,i]));
const edges = G.edges.map(e => ({...e, s: idx[e.source], t: idx[e.target]}))
                     .filter(e => e.s!=null && e.t!=null);
// adjacency for highlight
const adj = nodes.map(()=>new Set());
edges.forEach((e,i)=>{ adj[e.s].add(e.t); adj[e.t].add(e.s); });

// view transform
let scale=1, ox=0, oy=0, sel=null, drag=null, pan=null;
const cx=()=>W/2, cy=()=>H/2;
function toScreen(n){ return [ (n.x-cx())*scale+cx()+ox, (n.y-cy())*scale+cy()+oy ]; }
function toWorld(px,py){ return [ (px-cx()-ox)/scale+cx(), (py-cy()-oy)/scale+cy() ]; }

// force simulation (Fruchterman-Reingold-ish, no deps)
const K = 130;                       // ideal spring length
function step(){
  for (const n of nodes){ n.fx=0; n.fy=0; }
  // repulsion (O(n^2) — fine for a KB of dozens of notes)
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const a=nodes[i], b=nodes[j];
    let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+.01, d=Math.sqrt(d2);
    const f = 5200/d2;
    dx/=d; dy/=d; a.fx+=dx*f; a.fy+=dy*f; b.fx-=dx*f; b.fy-=dy*f;
  }
  // spring attraction along edges
  for (const e of edges){
    const a=nodes[e.s], b=nodes[e.t];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)+.01;
    const rest = e.kind==='wikilink'? K*0.7 : K;
    const f = (d-rest) * (e.kind==='wikilink'? 0.02 : 0.006) * Math.min(e.weight,4);
    dx/=d; dy/=d; a.fx+=dx*f; a.fy+=dy*f; b.fx-=dx*f; b.fy-=dy*f;
  }
  // gravity to center + integrate
  for (const n of nodes){
    if (n===drag) continue;
    n.fx += (cx()-n.x)*0.002; n.fy += (cy()-n.y)*0.002;
    n.vx=(n.vx+n.fx)*0.85; n.vy=(n.vy+n.fy)*0.85;
    n.x+=n.vx; n.y+=n.vy;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';
  // edges
  for (const e of edges){
    const a=nodes[e.s], b=nodes[e.t];
    const [ax,ay]=toScreen(a), [bx,by]=toScreen(b);
    const hot = sel!=null && (e.s===sel||e.t===sel);
    const dim = sel!=null && !hot;
    ctx.globalAlpha = dim?0.05 : (e.kind==='wikilink'?0.55:0.18);
    ctx.strokeStyle = e.kind==='wikilink' ? '#7fb0ff'
                     : mix(G.colors[a.category], G.colors[b.category]);
    ctx.lineWidth = (e.kind==='wikilink'?1.6:0.8) * Math.min(e.weight,3) * (hot?1.8:1);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // nodes
  for (let i=0;i<nodes.length;i++){
    const n=nodes[i], [x,y]=toScreen(n), r=n.r*Math.max(scale,.6);
    const hot = sel==null || i===sel || adj[sel].has(i);
    const col = G.colors[n.category]||G.colors.unknown;
    ctx.globalAlpha = hot?1:0.15;
    // glow
    const g=ctx.createRadialGradient(x,y,0,x,y,r*3);
    g.addColorStop(0,col+'cc'); g.addColorStop(1,col+'00');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*3,0,7); ctx.fill();
    // core
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    ctx.strokeStyle='#0009'; ctx.lineWidth=1; ctx.stroke();
    // label (when zoomed in, hub, or selected/neighbor)
    if ((scale>0.75 || n.degree>=4 || (sel!=null&&hot))){
      ctx.globalAlpha = hot?0.95:0.2;
      ctx.fillStyle='#dfe8f6'; ctx.font=`${Math.max(10,11*Math.min(scale,1.4))}px ui-monospace`;
      ctx.textAlign='center';
      ctx.fillText(n.slug, x, y - r - 4);
    }
  }
  ctx.globalAlpha=1;
}
function mix(a,b){ // average two #rrggbb
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const h=v=>('0'+Math.round(v).toString(16)).slice(-2);
  return '#'+h((r1+r2)/2)+h((g1+g2)/2)+h((b1+b2)/2);
}
let cool=0;
function loop(){ if(cool<600||drag){ step(); cool++; } draw(); requestAnimationFrame(loop); }
loop();

// ── interaction ────────────────────────────────────────────────────────
function pick(px,py){
  const [wx,wy]=toWorld(px,py); let best=null,bd=1e9;
  for(let i=0;i<nodes.length;i++){ const n=nodes[i];
    const d=Math.hypot(n.x-wx,n.y-wy); if(d<bd&&d<n.r+6){bd=d;best=i;} }
  return best;
}
cv.addEventListener('mousedown',e=>{
  const i=pick(e.clientX,e.clientY);
  if(i!=null){ drag=nodes[i]; sel=i; cool=0; cv.style.cursor='grabbing'; }
  else { pan={x:e.clientX,y:e.clientY,ox,oy}; sel=null; }
});
addEventListener('mousemove',e=>{
  if(drag){ const [wx,wy]=toWorld(e.clientX,e.clientY); drag.x=wx; drag.y=wy; drag.vx=drag.vy=0; }
  else if(pan){ ox=pan.ox+(e.clientX-pan.x); oy=pan.oy+(e.clientY-pan.y); }
  else { // hover tooltip
    const i=pick(e.clientX,e.clientY);
    if(i!=null){ const n=nodes[i];
      tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML=`<b>${n.title}</b><br><span style="color:${G.colors[n.category]}">${n.category}</span>`
        +` · ${n.degree} enlaces`+(n.updated?` · ${n.updated}`:'')
        +(n.tags.length?`<br><span class="tg">${n.tags.slice(0,8).join(' · ')}</span>`:'');
    } else tip.style.display='none';
  }
});
addEventListener('mouseup',()=>{ drag=null; pan=null; cv.style.cursor='grab'; });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0012); scale=Math.min(4,Math.max(.25,scale*f));
},{passive:false});
